[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "era_py"
version = "0.0.35"
description = "Helper functions and data for Python versions of Empirical Research in Accounting: Tools and Methods"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ian D. Gow"}]
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "statsmodels",
  "scipy",
  "requests",
  "gdown",
  "pyreadr",
  "patsy",
  "python-dotenv",
  "scikit-learn"
]

[project.optional-dependencies]
ibis = ["ibis-framework[postgres]"]
polars = ["polars>=2.0.0"]
tables = ["great-tables"]
plots = ["plotnine"]
docs = ["quartodoc>=0.11,<0.12", "griffe<2"]

[project.urls]
Homepage = "https://iangow.github.io/era_py/"
Documentation = "https://iangow.github.io/era_py/reference/"
Changelog = "https://iangow.github.io/era_py/news/index.html"
Repository = "https://github.com/iangow/era_py"
Issues = "https://github.com/iangow/era_py/issues"

[dependency-groups]
dev = [
  "build",
  "plotnine",
  "pytest",
  "twine",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
era_data = ["_data/*.parquet", "_data/*.meta.json"]
